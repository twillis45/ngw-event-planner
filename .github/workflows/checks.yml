# The safety net, automated (Up-Next #1, 2026-07-22). Two jobs:
#
#   jest — the Layer-1 engine proofs + the whole unit suite (decision-wire,
#          host-string lint, day-before coverage, one-overdue-policy equality,
#          path/lifecycle proofs — ~3,700 tests).
#   e2e  — the parity gate (inside `npm run build`) + the Layer-2 Playwright
#          board matrix on the BUILT bundle (loop-advance, rendered-copy lint,
#          pinned geometry + scroll-end reachability, fold peek).
#
# Added 2026-07-31 — backend, cra-build and hostv2-drift. All three already ran,
# but only inside the DEPLOYMENT workflow, which means a backend break, a broken
# production build, or a stale hostv2 artifact was discovered at deploy time
# rather than on the pull request that caused it. Same commands, moved left.
#
# Runs on every push/PR to working branches. Node 20 satisfies the e2e's ≥18
# requirement (locally the shell defaults to 16 — the harness docs cover it).
name: Checks

# EVERY PUSH TO A BRANCH WITH AN OPEN PR RAN THIS TWICE (fixed 2026-08-08).
# `push` + `pull_request` both fired, producing two identical runs of all five
# jobs — and e2e alone is ~19 minutes, so each push cost ~38 minutes of runner
# time for one commit's worth of signal. Measured on PR #83: runs 31255386923
# (event=push) and 31255388176 (event=pull_request), same SHA, same results.
#
# The concurrency block below could not collapse them, and that is worth
# understanding before anyone "simplifies" this again: `github.ref` is
# `refs/heads/<branch>` on push but `refs/pull/<n>/merge` on pull_request, so
# the two events landed in DIFFERENT groups and neither cancelled the other.
# The group key is now normalised to the branch name, which is identical across
# both events.
#
# `push` is now main-only. Working branches are covered by `pull_request`, which
# is where merges are decided, and main is covered on the way in. THE TRADE:
# a branch with NO open PR gets no automatic run — use workflow_dispatch, or
# open the PR early (a draft PR gets the full matrix).
#
# KNOWN, DELIBERATE OVERLAP ON MAIN, so nobody "fixes" it by accident: a merge
# runs jest and backend here AND again inside pages-from-source.yml's build job
# (`pytest` at :119, the jest suite at :126), which runs them before publishing.
# That is the release-integrity gate between source and published and it must
# keep its own tests — a deploy that trusts an upstream workflow's green is
# exactly the "no gate between source and published" hole that workflow was
# written to close. The overlap costs ~90s per merge. It is NOT the 19-minute
# e2e, which runs only here, and squash-merge means main's SHA is new anyway, so
# this run is not simply repeating the PR's.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # head_ref on a pull_request, ref_name on a push — the same string either way,
  # so a second push supersedes the first instead of racing it.
  group: checks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Least privilege: every job here only reads the repo, runs tests and builds.
# Nothing publishes, deploys, or writes back. No secrets or repository variables
# are referenced anywhere in this workflow.
permissions:
  contents: read

jobs:
  jest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # GOVERNED KNOWLEDGE BAKE GATE (Phase 5A-3). publishedKnowledge.json is a
      # build artifact derived from knowledge-exports/published-kcrs.json. Nothing
      # regenerated it, so a published KCR could land without its snapshot entry and
      # the runtime would keep serving authored values with no signal that governance
      # had moved. --check re-bakes in memory and fails on drift; it writes nothing,
      # makes no network call, and needs no new infrastructure. Runs BEFORE the suite
      # so a stale artifact reports as itself rather than as a confusing test failure.
      - run: npm run gate:knowledge
      - run: CI=true npx react-scripts test --watchAll=false

  e2e:
    runs-on: ubuntu-latest
    # The matrix itself is ~14 min end to end. Three times on 2026-08-19 the
    # `playwright install` step hung indefinitely (60-90+ min, runner-side),
    # squatting the concurrency slot until someone noticed. A hang is not a
    # verdict — kill it and let the next dispatch (or a manual re-run) try a
    # fresh runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hostv2/package-lock.json
      # BOTH trees: hostv2 bundles ../src via the @app alias, whose deps
      # (papaparse, …) live in the ROOT package.json — the first CI run failed
      # exactly there.
      - run: npm ci
      - run: npm ci
        working-directory: hostv2
      - run: npx playwright install --with-deps chromium
        working-directory: hostv2
      # The parity drift gate runs inside `npm run build` (check-parity.mjs).
      #
      # REACT_APP_API_BASE_URL here is a FAKE, reserved-TLD host (RFC 2606
      # .invalid — guaranteed to never resolve), not the real backend. Its only
      # job is to make isUnfurlConfigured() true in the built bundle so the
      # unfurl-dependent lodging e2e specs exercise their real code path; the
      # spec file intercepts every request to it via page.route() and returns
      # a fixed mock response, so nothing here ever touches a live network.
      # Before this, the e2e job built with NO REACT_APP_* values at all (the
      # same config-free build hostv2-build and the demo release profile use),
      # so isUnfurlConfigured() was false and the two specs that depend on it
      # could never pass in CI — found live, 2026-08-06, trying to merge this
      # PR with a red e2e gate.
      - run: npm run build
        working-directory: hostv2
        env:
          REACT_APP_API_BASE_URL: https://e2e-mock.invalid
      - run: npm run test:e2e
        working-directory: hostv2

  # ── Backend suite ──────────────────────────────────────────────────────────
  # Python 3.12 and the pinned requirements, matching the deployment workflow and
  # render.yaml's PYTHON_VERSION. --strict-markers turns a typo'd marker into an
  # error instead of letting it silently skip a test.
  #
  # No secrets, no database, no network: the suite stubs every outbound client and
  # asserts the real ones are never called. Setting nothing is part of the proof.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: backend
      - run: python -m pytest tests/ --strict-markers
        working-directory: backend

  # ── CRA production build ───────────────────────────────────────────────────
  # Proves main still produces a deployable artifact. It previously did not:
  # no workflow built the CRA app, so a real compile break could reach gh-pages.
  cra-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # CI is unset for THIS STEP ONLY. Actions always sets CI=true, and
      # react-scripts promotes every ESLint warning to a build error under it —
      # main carries known legacy warnings, so the build would fail for reasons
      # that have nothing to do with the change under review.
      #
      # This does NOT hide build failures: verified locally that a syntax error
      # still exits 1 with "Failed to compile" while the override is in place.
      # Deciding what to do about the legacy warnings is a separate concern with
      # its own gate; this job answers only "does main still build?".
      #
      # The Jest job above deliberately keeps CI=true.
      # ── UPGRADED TO THE WARNING-BASELINE GATE (2026-08-07) ────────────────
      # This step used to be a bare `npm run build`, which only answered "does
      # main still compile?". `gate:cra` runs that same real build — a syntax
      # error, missing module, or failed transform still exits 1 — and then
      # additionally fails on ANY new ESLint warning, any increase in an
      # existing one's count, or any warning in a file not already baselined.
      #
      # It is STRICTER than the plain build, never weaker: the baseline can
      # only excuse the 245 warnings that were already reviewed, and warnings
      # that DISAPPEAR are reported, never punished. See
      # scripts/cra-build-gate.mjs and docs/release/RELEASE_INTEGRITY.md.
      #
      # The gate manages warnings-as-errors itself, so the CI:'' override that
      # used to be needed here is gone.
      - name: CRA production build + warning baseline
        run: npm run gate:cra

  # ── hostv2 builds, and its markup matches its stylesheet ───────────────────
  # WAS `hostv2-drift`: public/hostv2 used to be a TRACKED build output, gated by
  # a byte-exact comparison against a fresh build. That gate rested on vite being
  # reproducible — true on ONE machine, false across machines. CI building this
  # very source produced HostShellV2-4c0ca35e.js against a committed d448e983, so
  # the gate could not go green on a PR no matter how recently the artifact was
  # synced. It was failing continuously from 2026-08-01.
  #
  # The artifact is no longer tracked (Model A — the end state this script always
  # named). Drift is now impossible by construction: every release path BUILDS it,
  # `npm run release` locally and the from-source Pages workflow in CI. What is
  # still worth gating is that hostv2 COMPILES and that check-parity passes, which
  # is what `npm run build` does in that tree.
  #
  # Deliberately given no REACT_APP_* values: a fresh checkout has no .env.local
  # or .env.production.local (both gitignored), so this is the config-free demo
  # build — the same one the release produces.
  hostv2-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hostv2/package-lock.json
      # BOTH trees — hostv2 bundles ../src via the @app alias, whose deps live in
      # the ROOT package.json.
      - run: npm ci
      - run: npm ci
        working-directory: hostv2
      # `npm run build` in hostv2 = check-parity && vite build. The parity check
      # is the real gate: it fails on any className with no matching selector.
      - run: npm run build
        working-directory: hostv2
