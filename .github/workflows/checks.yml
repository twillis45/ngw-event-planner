# The safety net, automated (Up-Next #1, 2026-07-22). Jobs:
#
#   jest     — the Layer-1 engine proofs + the whole unit suite (decision-wire,
#              host-string lint, day-before coverage, one-overdue-policy
#              equality, path/lifecycle proofs — ~4,200 tests).
#   e2e      — the parity gate (inside `npm run build`) + the Layer-2 Playwright
#              board matrix on the BUILT bundle (loop-advance, rendered-copy
#              lint, pinned geometry + scroll-end reachability, fold peek).
#   backend  — the FastAPI suite including the 49 AI-auth/SSRF security tests
#              (Release Integrity C1, 2026-07-30). These existed but ran
#              nowhere, so the security gates written in the previous sprint
#              gated nothing automatically.
#   cra-build — the CRA PRODUCTION build (Release Integrity C2). Previously no
#              workflow built the deployable app at all, so a real build break
#              could reach gh-pages unnoticed. Enforces a reviewed warning
#              baseline; see scripts/cra-build-gate.mjs.
#   hostv2-drift — proves public/hostv2/ still matches a build of the current
#              source (Release Integrity C3). The tracked artifact had drifted.
#
# Runs on every push/PR to working branches. Node 20 satisfies the e2e's ≥18
# requirement (locally the shell defaults to 16 — the harness docs cover it).
# Python 3.12 matches render.yaml's PYTHON_VERSION=3.12.7 (deployment truth).
name: Checks

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: CI=true npx react-scripts test --watchAll=false

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hostv2/package-lock.json
      # BOTH trees: hostv2 bundles ../src via the @app alias, whose deps
      # (papaparse, …) live in the ROOT package.json — the first CI run failed
      # exactly there.
      - run: npm ci
      - run: npm ci
        working-directory: hostv2
      - run: npx playwright install --with-deps chromium
        working-directory: hostv2
      # The parity drift gate runs inside `npm run build` (check-parity.mjs).
      - run: npm run build
        working-directory: hostv2
      - run: npm run test:e2e
        working-directory: hostv2

  # ── Release Integrity C1 — backend tests actually run ───────────────────────
  # No network, no provider credentials, no database: every outbound client in
  # these tests is stubbed and the suite asserts the real ones are never called.
  # Deliberately sets NO secrets, which is itself the proof.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'      # matches render.yaml PYTHON_VERSION
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: backend
      # --strict-markers turns an unknown/typo'd marker into an error instead
      # of letting it silently skip a security test.
      - run: python -m pytest tests/ --strict-markers
        working-directory: backend

  # ── Release Integrity C2 — the deployable app is actually built ─────────────
  cra-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Runs the real production build and compares its warnings against the
      # reviewed baseline in ci/cra-warning-baseline.json. A genuine build
      # error fails regardless of the baseline.
      - run: npm run gate:cra

  # ── Release Integrity C3 — the shipped hostv2 bundle matches its source ─────
  hostv2-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hostv2/package-lock.json
      # BOTH trees — hostv2 bundles ../src via the @app alias.
      - run: npm ci
      - run: npm ci
        working-directory: hostv2
      # Builds hostv2 from source and fails on ANY difference against the
      # tracked public/hostv2/ — changed hashes, missing files, stale
      # leftovers, or an index.html reference that does not resolve.
      - run: npm run gate:hostv2
