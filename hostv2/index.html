<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Event Boss — Host Shell V2 (wired prototype)</title>
    <!-- ── PWA: ICONS ONLY (B4, board 2026-07-28) ────────────────────────────
         The board verified: manifest.json declared only favicon.ico (Chromium
         needs 192 + 512), /hostv2/ carried NO manifest link at all, and the
         CRA manifest's scope:"." pointed at the CRA root — so an install would
         have launched the FROZEN App.js shell. This manifest is hostv2's own:
         start_url and scope both point here, so the icon on her home screen
         opens the app she was actually using.
         Deliberately NOT shipped, per the same ruling: no service worker (this
         deploy pipeline should not grow one), and no Web Share Target — it does
         not work on iOS at any version (WebKit bug 194593, open since 2019),
         so shipping it would be a promise the phone cannot keep. -->
    <link rel="manifest" href="/ngw-event-planner/hostv2-manifest.json" />
    <link rel="apple-touch-icon" href="/ngw-event-planner/icon-192.png" />
    <meta name="theme-color" content="#141518" />
    <!-- Playfair Display — the production display face (FF_SERIF in App.js),
         used on hero titles + the countdown numeral. Same URL, same weights,
         PLUS italic 500 (audit finding: the splash tagline asks for italic
         500 and it was never in this list — every browser silently
         substituted italic 700, so the authored weight had never rendered).
         900 stays even though only legacy's countdown numeral uses it
         (App.js) — this URL is shared, don't drop weights the other app needs. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Playfair weight 900 dropped 2026-07-30: a whole-source sweep of styles.css,
         HostShellV2.jsx and InviteV2.jsx (stationery CSS and JSX included) found ZERO
         demand for it — no font-weight:900, no fontWeight 900, nothing inheriting one.
         A live computed-style sweep of the plan surfaces resolved only 500-italic, but
         that could not reach the ?rsvp invite, so the source grep is the load-bearing
         evidence here, not the render. The remaining five are all still claimed:
         roman 700/800 explicitly, italic 500 explicitly, italic 700/800 by inheritance
         at styles.css:1472 and :1876. Do not trim further without re-running both. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,500;1,700;1,800&display=swap" fetchpriority="high" />
    <!-- NEWSREADER — the host HUMAN VOICE (elegant-minimal command language). Host rulings
         2026-07-17: serif beat sans (guide voice test), then unified Newsreader beat Fraunces
         (family test) for the Apple-register calm — warmth from the italic, not the letterform.
         ONE optical superfamily spans display (event name) + text (guide voice) via
         font-optical-sizing:auto. Playfair (--serif) stays the SEPARATE guest-stationery
         display serif. Roman + italic, full opsz range. (Fraunces link removed after ruling.) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" />
<style>
  /* Pre-mount only, and INLINE on purpose: a stylesheet is another request that
     can be slow or fail, and then the skeleton renders as bare text on a white
     page - which is the thing this exists to prevent. Matches the shell's matte
     surface so the handoff to the real UI is a content change, not a flash. */
  .preboot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;background:#141518;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .preboot-dot{width:8px;height:8px;border-radius:50%;background:#8a8f98;
    animation:preboot-pulse 1.1s ease-in-out infinite}
  .preboot-msg{margin:0;font-size:13px;font-weight:500;letter-spacing:.01em;color:#8a8f98}
  @keyframes preboot-pulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
  /* A host who asked for less motion still gets the message, just still. */
  @media (prefers-reduced-motion:reduce){.preboot-dot{animation:none;opacity:.8}}
</style>
</head>
  <body>
    <!-- PRE-MOUNT STATE: THE WHITE SCREEN WAS THE DEFECT (2026-08-16) -->
    <!--
      Until React mounts, `#root` was empty and a host on slow or flaky network
      saw plain white. The review board's Grandmother seat used her usability
      override on exactly this, and the reason is worth keeping in the file:

        "Around three seconds I think hm. Around six I tap it again, harder.
         At fifteen I put the phone down and ask my daughter to look on hers.
         Who do I blame? Myself, and then my phone - never the app."

      A white screen reads as BROKEN; a visible loading state reads as WORKING.
      That difference is nearly the whole experience and it has nothing to do
      with how long the load takes. It also matters because slow does not
      generate complaints, it generates quiet drop-off that never reaches us.

      This is inline HTML and CSS on purpose: it must render before any script
      is fetched, parsed or executed, which is precisely the window that was
      blank. It costs no JavaScript and adds nothing to any chunk.

      `createRoot().render()` replaces the children of #root, so this disappears
      the moment the shell mounts - no teardown code, nothing to keep in sync.
    -->
    <div id="root">
      <div class="preboot" role="status" aria-live="polite">
        <div class="preboot-dot"></div>
        <p class="preboot-msg">Getting your plan&hellip;</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
