<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grounded Action Loop — Motion + Aliveness</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@1,6..72,500&family=Inter:wght@400;500;600;700;800&display=swap" />
<style>
  :root{
    --bg:#141518; --ink:#eef0f4; --serif:#b9c2c9; --muted:#909296; --faint:#7f8288;
    --ok:#4fae7a; --warn:#eca13f; --mini:#2a2d31; --rulebg:#292b30;
    --ease-out:cubic-bezier(.22,1,.36,1); --ease-expo:cubic-bezier(.16,1,.3,1);
    --sans:'Inter',-apple-system,system-ui,sans-serif; --read:'Newsreader',Georgia,serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0b0c0e;font-family:var(--sans);display:grid;place-items:center;min-height:100vh;color:var(--ink);-webkit-font-smoothing:antialiased}
  .phone{width:390px;height:800px;background:var(--bg);border-radius:34px;position:relative;overflow:hidden;box-shadow:0 40px 120px -40px rgba(0,0,0,.85)}
  .screen{position:absolute;inset:0;padding:44px 28px 30px;display:flex;flex-direction:column}
  .eyebrow{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:.09em;color:var(--muted)}
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--warn)}
  .eyebrow .dot.ok{background:var(--ok)}
  .eyebrow .car{color:#55585e;font-weight:700}
  .stage{flex:1;display:flex;flex-direction:column;justify-content:center;position:relative}
  .act{display:flex;flex-direction:column;gap:15px}
  .ask{font-size:38px;font-weight:800;letter-spacing:-.026em;line-height:1.0}
  .voice{font-family:var(--read);font-style:italic;font-weight:500;font-size:18px;line-height:1.4;color:var(--serif);max-width:20em}
  /* TACTILE BUTTON — a raised physical key: a solid bottom edge (the button's "side"),
     a soft cast shadow, and a top inner highlight. On press it travels down and the edge
     collapses, so it reads as depressing into the surface. Paired with haptic + sound. */
  .btn{display:flex;align-items:center;justify-content:space-between;
    background:linear-gradient(180deg,#f6f8fa,#e3e6ea);color:#141518;border:none;border-radius:14px;
    padding:16px 18px 16px 20px;font:700 16px var(--sans);cursor:pointer;width:100%;
    box-shadow:0 3px 0 #b4b8bd, 0 9px 22px -9px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.75);
    transition:transform .1s var(--ease-out), box-shadow .1s var(--ease-out)}
  .btn:active,.btn.press{transform:translateY(3px);
    box-shadow:0 0 0 #b4b8bd, 0 3px 9px -5px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.55)}
  .btn .arw{color:#6a6e74;font-weight:700}
  .why{display:flex;gap:7px;font-size:12.5px;font-weight:500;color:var(--faint);max-width:300px;line-height:1.4}
  .why .wd{width:5px;height:5px;border-radius:50%;background:var(--ok);flex:0 0 auto;margin-top:5px}
  .receiptwrap{position:absolute;left:0;right:0;display:flex;flex-direction:column}
  .receipt{display:flex;align-items:center;gap:11px;background:#19201b;border-radius:12px;padding:13px 15px}
  .receipt .rd{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:0 0 auto}
  .receipt .rm{flex:1;font-size:14.5px;font-weight:600;color:#99b8a4}
  .receipt .undo{font-size:13.5px;font-weight:600;color:var(--muted)}
  .beat{font-family:var(--read);font-style:italic;font-weight:500;font-size:19px;line-height:1.4;color:var(--serif);margin-top:18px}
  .nextlabel{font-size:11px;font-weight:700;letter-spacing:.09em;color:var(--muted);margin-top:20px}
  .foot{display:flex;flex-direction:column;gap:11px}
  .rule{height:3px;border-radius:2px;background:var(--rulebg);overflow:hidden}
  .rule > i{display:block;height:100%;border-radius:2px;background:var(--ok);width:50%;transition:width .55s var(--ease-out)}
  .flabels{display:flex;justify-content:space-between;font-size:13px;font-weight:500;color:var(--faint)}
  .act,.receiptwrap,.beat,.nextlabel{transition:opacity .24s var(--ease-out), transform .3s var(--ease-out)}
  .hidden{opacity:0}
  .rise{opacity:0;transform:translateY(18px)}
  .rise.in{opacity:1;transform:none}
  .receiptwrap{opacity:0;transform:translateY(6px)}
  .receiptwrap.in{opacity:1;transform:none}
  @keyframes okring{0%{box-shadow:0 0 0 2px rgba(79,174,122,.6)}100%{box-shadow:0 0 0 2px rgba(79,174,122,0)}}
  .ring{animation:okring .7s var(--ease-out)}
  /* BREATH — opacity-only, slow, alive */
  @keyframes breathe{0%,100%{opacity:1}50%{opacity:.82}}
  .voice,.beat{animation:breathe 7s ease-in-out infinite}
  .eyebrow .dot{animation:breathe 3.4s ease-in-out infinite}
  /* completion */
  .rule.full > i{background:var(--ok)}
  .soundhint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:11.5px;color:#6a6d73;background:rgba(30,32,36,.7);padding:6px 12px;border-radius:100px;cursor:pointer;transition:opacity .4s;z-index:10}
  .soundhint.gone{opacity:0;pointer-events:none}
  .caption{position:fixed;bottom:26px;left:0;right:0;text-align:center;font-size:12.5px;color:#6a6d73;letter-spacing:.02em}
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="eyebrow"><span class="dot" id="ebdot"></span><span id="eb">PLAN&nbsp; ·&nbsp; 43 DAYS&nbsp; ·&nbsp; RETIREMENT PARTY</span><span class="car">▾</span></div>
    <div class="stage">
      <div class="receiptwrap" id="receiptwrap">
        <div class="receipt" id="receipt"><span class="rd"></span><span class="rm" id="rm"></span><span class="undo">Undo</span></div>
        <div class="beat" id="beat"></div>
        <div class="nextlabel" id="nextlabel">NEXT</div>
      </div>
      <div class="act" id="act">
        <div class="ask" id="ask"></div>
        <div class="voice" id="voice"></div>
        <button class="btn" id="btn"><span id="btnlabel"></span><span class="arw">→</span></button>
        <div class="why" id="why"><span class="wd"></span><span id="whytext"></span></div>
      </div>
    </div>
    <div class="foot">
      <div class="rule" id="rule"><i id="fill" style="width:50%"></i></div>
      <div class="flabels"><span id="fl">4 of 7 clashes cleared</span><span id="fr">the rest can wait</span></div>
    </div>
  </div>
  <div class="soundhint" id="soundhint">🔊 tap for sound + haptics</div>
</div>
<div class="caption" id="cap">breath · micro-motion · haptic tick · sound — the aliveness layer</div>
<script>
  const $=id=>document.getElementById(id);
  // ---- SOUND DESIGN (Web Audio) ----
  let ac=null;
  function tone(freq,dur,type,gain,when){ // soft, warm, premium
    if(!ac) return; const t=ac.currentTime+(when||0);
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(gain||.08,t+.008);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+.02);
  }
  const tock =()=>{ tone(174,.13,'sine',.09); tone(87,.16,'sine',.05); };      // resolve: warm low tock
  const rise =()=>{ tone(392,.10,'triangle',.03); };                           // next rises: faint
  const chime=()=>{ tone(523.25,.5,'sine',.07); tone(783.99,.6,'sine',.05,.06); }; // completion: soft fifth up
  const vibe =(p)=>{ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} };

  const items=[
    {ask:'Two vendors want<br>the same hour.', voice:'Semper arrives 5:00; the Ironwood Room opens 6:00.', btn:'Move Semper to 6:00', why:'Why: the room isn’t unlocked before 6, and Semper only needs 45 min.', receipt:'Semper set to 6:00 — that clash is gone.', beat:'One down. Six to go — and the next is smaller.', fill:64, fl:'5 of 7 clashes cleared'},
    {ask:'The DJ and the toast<br>both want 8:00.', voice:'The toast runs ~15 min; the DJ can bridge it either side.', btn:'Toast at 8:00, music resumes 8:20', why:'Why: guests are seated for the toast, then back to the floor.', receipt:'Toast locked for 8:00 — the DJ bridges it.', beat:'Two down. The evening’s starting to line up.', fill:86, fl:'6 of 7 clashes cleared'},
    {ask:'One reply locks<br>the room.', voice:'The club needs proof of insurance to hold Aug 29.', btn:'Send the club the insurance ask', why:'Why now: no COI on file, and the courtesy hold expires Friday.', receipt:'Message sent — the room’s holding Aug 29.', beat:'That was the last one.', fill:100, fl:'7 of 7 clashes cleared', done:true},
  ];
  let i=0;
  function setAction(it){ $('ask').innerHTML=it.ask; $('voice').textContent=it.voice; $('btnlabel').textContent=it.btn; $('whytext').textContent=it.why; }
  const wait=ms=>new Promise(r=>setTimeout(r,ms));

  async function completion(){
    // payoff state: everything clears to the reward
    $('receiptwrap').classList.remove('in');
    $('ebdot').classList.add('ok');
    $('eb').innerHTML='PLAN&nbsp; ·&nbsp; 43 DAYS&nbsp; ·&nbsp; RETIREMENT PARTY';
    setAction({ask:'Your vendors<br>are in sync.', voice:'All seven clashes gone. Nobody’s stepping on anyone — the evening runs clean from setup to send-off.', btn:'', why:''});
    $('btn').style.display='none'; $('why').style.display='none';
    $('ask').style.color='var(--ink)';
    $('act').classList.add('rise'); $('act').classList.remove('hidden'); await wait(30); $('act').classList.add('in');
    chime(); vibe([10,45,16]);
    $('rule').classList.add('full'); $('fill').style.width='100%'; $('fl').textContent='vendors clear'; $('fr').textContent='nothing else needs you';
    await wait(30); $('act').classList.remove('rise'); $('act').classList.remove('in');
    await wait(3000);
    // reset to start the loop again
    $('btn').style.display=''; $('why').style.display='';
    $('rule').classList.remove('full'); $('fill').style.width='50%'; $('fl').textContent='4 of 7 clashes cleared'; $('fr').textContent='the rest can wait';
    $('ebdot').classList.remove('ok');
    i=0; setAction(items[0]);
  }

  async function runOnce(){
    const it=items[i];
    $('btn').classList.add('press'); await wait(130); $('btn').classList.remove('press');
    tock(); vibe(8);                                   // HAPTIC + SOUND on resolve
    $('act').classList.add('hidden'); $('act').style.transform='translateY(-14px)';
    $('rm').textContent=it.receipt; $('beat').textContent=it.beat;
    await wait(120);
    $('receiptwrap').classList.add('in'); $('receipt').classList.add('ring');
    $('fill').style.width=it.fill+'%'; $('fl').textContent=it.fl;
    await wait(1600);
    if(it.done){ $('receipt').classList.remove('ring'); await completion(); await wait(1200); return; }
    const nx=items[(i+1)%items.length];
    $('receipt').classList.remove('ring'); $('receiptwrap').classList.remove('in');
    setAction(nx);
    $('act').classList.remove('hidden'); $('act').classList.add('rise'); $('act').style.transform='';
    await wait(30); $('act').classList.add('in'); rise();
    await wait(340); $('act').classList.remove('rise'); $('act').classList.remove('in');
    i=(i+1)%items.length;
    await wait(1900);
  }

  // AUTO-PLAY the visual animation on load (sound stays muted until a click — browsers
  // require a gesture for audio; tone() no-ops while ac is null).
  function enableSound(){ if(ac) return; try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} $('soundhint').classList.add('gone'); }
  document.body.addEventListener('click', enableSound);
  window.__begin=enableSound;
  (async()=>{ setAction(items[0]); await wait(900); while(true){ await runOnce(); } })();
</script>
</body>
</html>
