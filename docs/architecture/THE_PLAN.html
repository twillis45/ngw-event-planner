_Single source of truth · **2026-07-17** · Supersedes `2026-07-17_WHERE_WE_ARE.md`,
`2026-07-11_EXECUTION_PLAN_AND_COST.md`, and the five scattered roadmaps. Those files stay as history with a
superseded banner; this is the one to read and the one to keep current._

> **Why this doc exists.** Five roadmaps were running at once — sprints, tiers, waves, and three scoreboards
> counting to 10, 50, and 420 — none referencing each other, their numbers disagreeing. The corrections lived in
> one place, the stale claims in another, and the repo docs had drifted from their claude.ai artifacts. This
> consolidates all of it into a single ledger whose every row is **proven current** — driven in the live shell
> where a surface exists, verified at `file:line` where it doesn't. A row is only as true as its last check;
> **date any change you make here.**

**Standard for this doc:** a plan has two kinds of rows and only one reverses. **Facts** (status, counts) go
*stale* — cheap to refresh. **Prescriptions** (delete legacy, route to Haiku, gate genAI, edge functions)
*reverse on contact*, because they were reasoned before the code existed. **Every prescription hides a premise;
test the premise, not the prescription — at planning time.** Thirteen rows have reversed under investigation
(eleven on the first pass, two more when this doc's own predecessor was re-proven). See §6.

## 0 · ⛔→✅ Legacy is not being deleted — RULED, CLOSED

**`src/App.js` is not "the legacy host shell." It is that AND the entire planner app**, in one 46,988-line file.
`index.js` mounts `<App/>` at `/`; App.js imports `CommandCenter` (planner L3, `:137`, 17 refs) and holds
`EventCommTab` (L4) and `DailyBriefing` (L2). **There is no `plannerv2`.**

**Two independent reasons deleting the CRA is destructive:**
1. It deletes the **planner product** — no replacement, no port.
2. It breaks **hostv2 too.** `hostv2/vite.config.js` aliases `@app` → `../src`, and the go-forward host shell
   imports **103 modules** from that tree — including `CommandCenter` itself and ~90 `lib/` engines. hostv2 is a
   Vite front end riding on the CRA's source, not a standalone app.

> **✅ HOST RULING, 2026-07-17: "legacy is not going to be deleted any time soon."** The deletion row — the single
> most dangerous item in every prior plan, and the one most confidently marked "mechanical" — is **CLOSED, not
> scheduled.** It returns only if a `plannerv2` program is chartered. The `~25 MB CRA still ships` /
> `react-scripts` build weight is real but is a **bundle-size** concern, not a deletion trigger.

The file's own freeze header — *"FROZEN — legacy CRA host shell"* — names half of what the file is, and misled
every "delete legacy" reasoning step across every plan. Legacy stays **frozen and donor-only** (security/data-loss
fixes + shared `lib/` engine work only); it is not deleted.

## 6 · The method — prove the plan

**The host's diagnosis:** *"we keep getting to steps in plan that are reversed after investigated."* That's not bad
luck; it's how plans are built. Premises proven false so far: *cost matters* (a nickel/event) · *one guard fits
every AI job* (extraction ≠ answering) · *the donor's value is spent* (it's the planner) · *we deploy to an edge*
(Render free, single region) · *the prefix is cacheable* (under the floor) · *an entitlement boundary exists* (auth
≠ payment) · *the $39 pass gates something* (nothing) · *grounding is enforced* (it warns) · *one model everywhere*
(App.js BYOK haiku).

**Before sequencing work on a row, extract its premise and test it — at planning time, not at the moment of action,
which is the most expensive place to find out.** A row that can't name a testable premise isn't a plan row; it's an
intention. The method only earns trust by catching its author: two of the reversals above were this doc's own
predecessor, re-proven an hour after it was written.

<script>
function inline(s){
  return s
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/`([^`]+)`/g,(m,c)=>'<code>'+c+'</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/~~([^~]+)~~/g,'<del>$1</del>')
    .replace(/\[\[([^\]]+)\]\]/g,'<em>[[$1]]</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>')
    .replace(/(^|[^*])\*([^*]+)\*(?!\*)/g,'$1<em>$2</em>')
    .replace(/(^|[^\w])_([^_]+)_(?![\w])/g,'$1<em>$2</em>');
}
const lines = document.getElementById('src').textContent.split('\n');
let out='', i=0;
function flushTable(){ /* handled inline */ }
while(i<lines.length){
  let ln = lines[i];
  // table: header row followed by separator
  if(/^\s*\|.*\|\s*$/.test(ln) && i+1<lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
    const header = ln.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
    i+=2; let rows=[];
    while(i<lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){
      rows.push(lines[i].trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim())); i++;
    }
    out+='<table><thead><tr>'+header.map(h=>'<th>'+inline(h)+'</th>').join('')+'</tr></thead><tbody>';
    out+=rows.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('');
    out+='</tbody></table>'; continue;
  }
  if(/^#\s/.test(ln)){ out+='<h1>'+inline(ln.slice(2))+'</h1>'; i++; continue; }
  if(/^##\s/.test(ln)){ out+='<h2>'+inline(ln.slice(3))+'</h2>'; i++; continue; }
  if(/^###\s/.test(ln)){ out+='<h3>'+inline(ln.slice(4))+'</h3>'; i++; continue; }
  if(/^---\s*$/.test(ln)){ out+='<hr>'; i++; continue; }
  if(/^>\s?/.test(ln)){
    let block=[];
    while(i<lines.length && /^>\s?/.test(lines[i])){ block.push(lines[i].replace(/^>\s?/,'')); i++; }
    out+='<blockquote>'+block.filter(x=>x.trim()!=='').map(x=>'<p>'+inline(x)+'</p>').join('')+'</blockquote>'; continue;
  }
  if(/^[-*]\s/.test(ln)){
    let items=[];
    while(i<lines.length && /^[-*]\s/.test(lines[i])){ items.push(lines[i].replace(/^[-*]\s/,'')); i++; }
    out+='<ul>'+items.map(x=>'<li>'+inline(x)+'</li>').join('')+'</ul>'; continue;
  }
  if(ln.trim()===''){ i++; continue; }
  // paragraph: gather until blank
  let para=[ln]; i++;
  while(i<lines.length && lines[i].trim()!=='' && !/^[#>|-]/.test(lines[i]) && !/^[-*]\s/.test(lines[i])){ para.push(lines[i]); i++; }
  out+='<p>'+inline(para.join(' '))+'</p>';
}
// colorize verdict cells
out = out.replace(/✅/g,'<span class="tag-ok">✅</span>').replace(/❌|⛔|🔴/g,m=>'<span class="tag-bad">'+m+'</span>').replace(/⚠️|🟠|🟡/g,m=>'<span class="tag-warn">'+m+'</span>');
document.getElementById('out').innerHTML = out;
</script></body></html>
