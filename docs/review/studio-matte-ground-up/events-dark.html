 if(state.scenario==='empty'){main.innerHTML=`<section class="panel empty"><span class="eyebrow">Your first event</span><h1>Start with the occasion.</h1><p>Tell us what you’re bringing people together for. No sales pipeline. No empty control panels.</p>${btn('Create a sample event','new','primary')}</section>`+footer();return}

  const b=document.createElement('button');b.className='textbtn';b.dataset.action='decisions';b.textContent='Review your options →';section?.append(b);
 }
 if(route()==='venue'){
  const foot=main.querySelector('.actionfoot');
  const b=document.createElement('button');b.className='btn';b.dataset.action='assist';b.textContent='Prepare this for me';foot?.append(b);
 }
};
function moveDecision(delta){state.decisionIndex=(state.decisionIndex+delta+decisions.length)%decisions.length;render();const card=document.querySelector('#decision-card');card?.focus({preventScroll:true});card?.scrollIntoView({block:'start'});toast(`Decision ${state.decisionIndex+1} of ${decisions.length}. Nothing accepted.`)}
function setChoice(value){const i=state.decisionIndex;state.choiceUndo.push({i,old:state.choices[i]});state.choices[i]=value;render();document.querySelector('#decision-card')?.focus({preventScroll:true});toast(value==='Shortlisted'?'Added to your shortlist. No booking or approval.':'Set aside for this session. No requirement removed.')}
actions.decisions=()=>go('decisions');actions['decision-prev']=()=>moveDecision(-1);actions['decision-next']=()=>moveDecision(1);actions['choice-keep']=()=>setChoice('Shortlisted');actions['choice-later']=()=>setChoice('Not now');actions['choice-undo']=()=>{const u=state.choiceUndo.pop();if(!u){toast('No choice to undo.');return}state.decisionIndex=u.i;if(u.old===undefined)delete state.choices[u.i];else state.choices[u.i]=u.old;render();toast('Last choice restored.')};
actions.assist=()=>modal('Prepared for your review',`<p>Sample DIFM interaction: a focused venue question draft, not a live AI response. It asks for unknown facts rather than inventing answers.</p><form id="assistform"><label class="field">Editable draft<textarea class="input" name="draft" rows="6" maxlength="3000" required>${esc(state.assistDraft||'Hello, we are reviewing the hall for our 14 November retirement celebration. Could you confirm setup and cleanup access, step-free entry, outside-catering rules, cancellation terms and what the quoted rental fee covers? Please also share the agreement for review. Thank you.')}</textarea></label><details><summary>Facts and privacy boundaries</summary><p>Used: sample event date, occasion and unresolved venue questions. Not included: internal budget limit, guest names, dietary details or private decision rationale. No claim that the booking is confirmed.</p></details><button class="btn primary" type="submit">Keep draft in this preview</button><p style="margin:16px 0 0">Nothing is sent. Production should use the existing DIFM draft → edit → explicit share path.</p></form>`);
document.addEventListener('submit',e=>{if(e.target.id==='assistform'){e.preventDefault();state.assistDraft=new FormData(e.target).get('draft');close();toast('Draft kept in this preview. Nothing sent.')}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-decision]');if(b){state.decisionIndex=Number(b.dataset.decision);render()}});
let swipe=null;
document.addEventListener('pointerdown',e=>{const card=e.target.closest('#decision-card');if(card&&!e.target.closest('button,a,input,textarea,summary')&&e.isPrimary){swipe={id:e.pointerId,x:e.clientX,y:e.clientY};card.setPointerCapture(e.pointerId)}});
document.addEventListener('pointercancel',()=>swipe=null);
document.addEventListener('pointerup',e=>{if(!swipe||swipe.id!==e.pointerId)return;const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;swipe=null;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5)moveDecision(dx<0?1:-1)});
document.addEventListener('keydown',e=>{if(e.target.id==='decision-card'&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();moveDecision(e.key==='ArrowRight'?1:-1)}});
render();

// Native previews preserve the current route and scroll position. Local sample only.
const reducedMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function animateElement(el,frames,duration=220){if(el&&!reducedMotion()&&el.animate)el.animate(frames,{duration,easing:'cubic-bezier(.2,.8,.2,1)'});}
const originalModal=modal;
modal=function(title,html){dialog.classList.remove('peek');originalModal(title,html);animateElement(dialog,[{opacity:.5,transform:'translateY(8px)'},{opacity:1,transform:'translateY(0)'}],160)};
const previews={
 venue:{title:'The place',name:'Community hall',tag:'Place & setup',description:'A place for the meal, the tribute and the people who matter.',facts:()=>[['Status',state.venue?'Confirmation recorded':'Hold only'],['Estimate','$1,200'],['Access','2–9 PM · unconfirmed'],['Capacity','100 seated · sample']],note:'Check access, catering rules and cancellation terms before agreeing.',action:'venue',cta:'Open venue agreement'},
 guests:{title:'Guest replies',name:'Make everyone feel expected.',tag:'Your people',description:'54 coming, 22 awaiting a reply and 4 unable to attend in this sample event.',facts:()=>[['Invited','80'],['Coming','54'],['Awaiting a reply','22']],note:'Dietary and access details belong with the individual guest record.',action:'guests',cta:'Open guest replies'},
 day:{title:'The next handoff',name:'Open the room.',tag:'The Day · draft',description:'Start with access, then give each helper a clear place to begin.',facts:()=>[['Draft cue','14 November · 2 PM'],['Owner','Alex · setup lead'],['Access','Needs confirmation']],note:'This is a planning cue. No helper has acknowledged it here.',action:'day',cta:'Open the schedule'},
 food:{title:'Food & drink',name:'A meal with room to talk.',tag:'Your plan',description:'Keep dinner comfortable and leave enough time for the stories.',facts:()=>[['Allowance','$1,800 · estimate'],['Replies','54 coming'],['Dietary needs','Still to collect']],note:'Final quantities depend on guest replies and confirmed catering arrangements.',action:'food',cta:'Open the food plan'},
 ceremony:{title:'The moment',name:'Let the stories have their space.',tag:'Recognition & memories',description:'Two short tributes, followed by time for family portraits.',facts:()=>[['Speakers','Not yet confirmed'],['Portraits','Draft cue · 6:30 PM']],note:'These choices come from the sample brief. Speaker acceptance is still needed.',action:'ceremony',cta:'Open recognition plan'}
};
function openPeek(key){const p=previews[key];if(!p)return;originalModal(p.title,`<div class="peek-handle" aria-hidden="true"></div><div class="eyebrow muted">${p.tag}</div><h3 class="peek-title">${p.name}</h3><p>${p.description}</p><dl class="peek-facts">${p.facts().map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl><div class="callout"><strong>Keep in mind</strong>${p.note}</div><div class="peek-sticky">${btn(p.cta+' '+icon('arrow'),p.action,'primary')}<p style="font-size:11px;margin:12px 0 0">Sample details · Close to return to where you were.</p></div>`);dialog.classList.add('peek');animateElement(dialog,innerWidth<600?[{transform:'translateY(28px)',opacity:.6},{transform:'translateY(0)',opacity:1}]:[{transform:'translateX(28px)',opacity:.6},{transform:'translateX(0)',opacity:1}],260);}
const enhancedRender=render;
state.receipt=null;state.confirmUndo=null;state.completionMotion=false;
render=function(){enhancedRender();if(state.scenario!=='normal')return;
 const r=route();
 if(r==='overview'){
  const hero=main.querySelector('.hero');
  const group=document.createElement('div');group.className='preview-actions';
  group.innerHTML=`<button class="peek-trigger" data-peek="${state.venue?'food':'venue'}">${icon('search')} Quick look</button>`;
  const options=hero?.querySelector('[data-action=decisions]');if(options)group.append(options);hero?.append(group);
  if(state.receipt){const receipt=document.createElement('div');receipt.className='receipt';receipt.setAttribute('role','status');receipt.innerHTML=`<span class="receipt-icon">${icon('check')}</span><div><strong>Venue confirmation recorded.</strong><p>Your food plan is ready to review. One decision carried forward.</p></div><button data-action="undo-confirm">Undo</button>`;hero?.before(receipt)}
  if(state.completionMotion){state.completionMotion=false;animateElement(main.querySelector('.receipt'),[{transform:'translateY(-8px)',opacity:0},{transform:'translateY(0)',opacity:1}],320);animateElement(hero,[{opacity:.5,transform:'translateY(10px)'},{opacity:1,transform:'translateY(0)'}],360)}
 }
 if(r==='plan'){main.querySelectorAll('.listrow').forEach(row=>{const key=row.dataset.action;if(!previews[key])return;const wrap=document.createElement('div');wrap.className='between';row.replaceWith(wrap);wrap.append(row);const button=document.createElement('button');button.className='iconbtn';button.setAttribute('aria-label','Preview '+previews[key].title);button.dataset.peek=key;button.innerHTML=icon('search');button.style.marginRight='12px';wrap.append(button)})}
 if(r==='decisions'){const card=main.querySelector('#decision-card');const pips=document.createElement('div');pips.className='choice-pips';pips.setAttribute('aria-label','Decision position');pips.innerHTML=decisions.map((d,i)=>`<button data-decision="${i}" aria-label="Review ${esc(d.name)}" aria-current="${state.decisionIndex===i}"></button>`).join('');card?.before(pips);const p=card?.parentElement;if(p){p.style.position='relative';pips.style.gridColumn='1/-1'}const hint=document.createElement('p');hint.className='gesture-hint';hint.textContent='Drag to explore · Your choices stay in your control';card?.prepend(hint);}
 if(r==='guests'&&state.guestfilter==='Awaiting'){const bar=document.createElement('div');bar.className='context-actions';bar.innerHTML='<p><strong>Awaiting replies</strong><br>Prepare a gentle follow-up for this group.</p>'+btn('Prepare reminder','reminder','primary');main.querySelector('.panel')?.before(bar)}
 enhanceGuests();
};
function enhanceGuests(){main.querySelectorAll('.guestrow').forEach((row,i)=>{row.tabIndex=0;row.setAttribute('role','button');row.setAttribute('aria-label','Preview '+row.querySelector('strong').textContent);row.dataset.guestpeek=row.querySelector('strong').textContent;if(!row.querySelector('.guest-peek-label')){const label=document.createElement('span');label.className='guest-peek-label';label.textContent='View details →';row.querySelector('strong').after(label)}});
};
document.addEventListener('input',e=>{if(e.target.id==='guestsearch')enhanceGuests()});
actions['undo-confirm']=()=>{if(!state.confirmUndo)return;state.venue=state.confirmUndo.venue;state.history=state.confirmUndo.history;state.receipt=null;state.confirmUndo=null;render();animateElement(main.querySelector('.hero'),[{opacity:.6},{opacity:1}]);toast('Confirmation undone. The venue decision is back in your plan.');};
document.addEventListener('submit',e=>{if(e.target.id!=='confirmform')return;e.preventDefault();e.stopImmediatePropagation();const f=new FormData(e.target);state.confirmUndo={venue:state.venue,history:[...state.history]};state.venue=true;state.history.push({note:f.get('reason')});state.receipt=true;state.completionMotion=true;close();go('overview');window.scrollTo(0,0);},true);
document.addEventListener('click',e=>{const peek=e.target.closest('[data-peek]');if(peek)openPeek(peek.dataset.peek);const guest=e.target.closest('[data-guestpeek]');if(guest)openGuestPeek(guest.dataset.guestpeek);});
function openGuestPeek(name){const g=guests.find(g=>g[0]===name);if(!g)return;originalModal('Guest details',`<div class="peek-handle" aria-hidden="true"></div><div class="eyebrow muted">Your people · Sample record</div><h3 class="peek-title">${esc(g[0])}</h3><p>${esc(g[1])}</p>${chip(g[2],g[2]==='Coming'?'ok':'')}<div class="callout" style="margin-top:24px"><strong>Keep the human details close.</strong>Access and dietary notes help you prepare a thoughtful welcome. They are not included in reminder drafts.</div><div class="peek-sticky">${g[2]==='Awaiting'?btn('Prepare a reminder','reminder'):''}${btn('Back to guest list','close')}</div>`);dialog.classList.add('peek');animateElement(dialog,[{opacity:.5,transform:'translateY(12px)'},{opacity:1,transform:'translateY(0)'}]);}
document.addEventListener('keydown',e=>{const g=e.target.closest('[data-guestpeek]');if(g&&['Enter',' '].includes(e.key)){e.preventDefault();openGuestPeek(g.dataset.guestpeek)}});
// Pointer travel follows the hand. Gesture outcome remains browse-only.
document.addEventListener('pointermove',e=>{if(!swipe||swipe.id!==e.pointerId||reducedMotion())return;const card=document.querySelector('#decision-card');if(!card)return;const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;if(Math.abs(dx)<Math.abs(dy))return;const travel=Math.max(-80,Math.min(80,dx*.35));card.classList.add('dragging');card.style.transform=`translateX(${travel}px) rotate(${travel/45}deg)`;card.style.opacity=String(1-Math.abs(travel)/400)});
function resetDrag(){const c=document.querySelector('#decision-card');if(c){c.classList.remove('dragging');c.style.transform='';c.style.opacity=''}}
document.addEventListener('pointercancel',resetDrag);document.addEventListener('pointerup',resetDrag);
const oldMoveDecision=moveDecision;moveDecision=function(delta){oldMoveDecision(delta);animateElement(document.querySelector('#decision-card'),[{opacity:.6,transform:`translateX(${delta>0?20:-20}px)`},{opacity:1,transform:'translateX(0)'}],200)};
const oldSetChoice=setChoice;setChoice=function(value){oldSetChoice(value);animateElement(document.querySelector('#choice-status'),[{transform:'scale(.94)',opacity:.6},{transform:'scale(1)',opacity:1}],180)};
const reviewStates=actions.review;
actions.review=()=>modal('Try the interactions',`<p>Interaction revision 3 · Choose a working example. Personal photographs and live AI are not implemented.</p><div class="demo-examples"><button class="btn" data-action="demo-peek"><strong>1 · Open a quick look</strong><span>See the phone sheet or tablet side panel. Close it without losing your place.</span></button><button class="btn" data-action="demo-choices"><strong>2 · Swipe and shortlist</strong><span>Drag the card heading sideways, then select Shortlist and Undo last choice.</span></button><button class="btn" data-action="demo-completion"><strong>3 · Record a confirmation</strong><span>Open Record confirmation, enter a reason and check the sample acknowledgment. Then watch the next priority appear.</span></button><button class="btn" data-action="demo-draft"><strong>4 · Edit a prepared draft</strong><span>Change the sample text, keep it, and reopen Prepare this for me. No live AI or sending.</span></button></div><p style="margin-top:20px">On Guests, choose View details on a person. Select Awaiting to reveal the group reminder action.</p>${btn('Other preview states','demo-states')}`);
actions['demo-states']=reviewStates;
actions['demo-peek']=()=>openPeek('venue');
actions['demo-choices']=()=>{state.scenario='normal';go('decisions')};
actions['demo-completion']=()=>{state.scenario='normal';if(state.venue){toast('Confirmation already recorded. Use Undo on Your event to replay.');go('overview')}else go('venue')};
actions['demo-draft']=()=>actions.assist();
const demoButton=document.querySelector('.preview [data-action=review]');demoButton.textContent='Try demo · v3';
render();

</script></body></html>
