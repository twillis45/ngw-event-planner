guests','22 invitations still need a reply','guests')}</section><section class="panel pad"><div class="between"><div><h2>Remember what matters</h2><p class="muted" style="font-size:12px;margin-top:8px">Time for recognition. Time for family. No rushed speeches.</p></div>${icon('history')}</div><details><summary>View the event brief</summary><p>Sample brief: an intimate retirement celebration, an accessible venue, a seated meal, short personal tributes and space for family portraits.</p></details></section></div><aside class="aside stack"><section class="panel pad"><div class="between"><h2>Your people</h2>${icon('guests')}</div><div class="metricrow"><div class="metric"><strong>54</strong><span>coming</span></div><div class="metric"><strong>22</strong><span>awaiting a reply</span></div></div><div class="track" aria-hidden="true"><span style="width:67.5%"></span></div><p class="muted" style="font-size:12px">4 can’t make it · 80 invited</p><a class="textbtn" href="#guests">View guest replies ${icon('arrow')}</a></section><section class="panel pad"><div class="between"><h2>Spending plan</h2>${icon('budget')}</div><div class="metricrow"><div class="metric"><strong>$4,200</strong><span>planned · includes estimates</span></div></div><p class="muted" style="font-size:12px">$800 below your $5,000 limit.</p><a class="textbtn" href="#budget">See what’s included ${icon('arrow')}</a></section><section class="panel pad"><h2>Coming into focus</h2><div class="minilist"><div class="coming"><div class="datebox">OCT<b>20</b></div><div><h3>Venue hold ends</h3><p>${state.venue?'Confirmation recorded in this preview':'Confirm terms before the hold expires'}</p></div></div><div class="coming"><div class="datebox">OCT<b>24</b></div><div><h3>Menu conversation</h3><p>Bring the guest count and dietary needs</p></div></div></div><div class="phase"><strong>Plan</strong><span></span>Prepare<span></span>The Day</div></section></aside></div>`}
const works=[['venue','Place & setup','Community hall · agreement and access times',()=>state.venue?'Confirmed':'Needs your decision'],['food','Food & drink','Menu, dietary needs and quantities',()=>state.venue?'Ready to review':'Waiting on venue'],['ceremony','Recognition & memories','Speakers, portraits and keepsakes',()=>'In progress'],['guests','Guests & invitations','Replies and accessibility needs',()=>'22 replies outstanding'],['day','The Day','A shared sequence, with clear owners',()=>'Draft schedule']];
function plan(){const rows=works.filter(w=>state.filter!=='attention'||w[0]==='venue'&&!state.venue||w[0]==='guests');return `${heading('A plan with a clear order.','Related decisions stay together. Open a part of the event to do the work.')}<div class="tabs">${['all','attention'].map(f=>`<button class="tab" data-filter="${f}" aria-pressed="${state.filter===f}">${f==='all'?'Whole event':'Needs attention'}</button>`).join('')}</div><div class="board"><section class="panel"><header class="sectionhead"><h2>Your plan</h2></header>${rows.map((w,i)=>taskrow(String(i+1).padStart(2,'0'),w[1],w[2],w[0],chip(w[3](),w[0]==='venue'&&state.venue?'ok':''))).join('')}</section><aside class="panel pad"><h2>One decision unlocks the next</h2><div class="minilist"><div><h3>Place & access</h3><p>Before room layout and arrival times.</p></div><div><h3>Guest replies</h3><p>Before final food quantities.</p></div><div><h3>Food & timing</h3><p>Before the final schedule is shared.</p></div></div><p class="note" style="padding-left:0;margin-top:20px">Illustrative dependencies for this sample event, not an AI-generated assessment.</p></aside></div>`}
function venue(){return `${heading('Confirm the venue.','Place & setup · Work on the agreement, not another dashboard.')}<a href="#plan" class="textbtn">${icon('back')} Back to plan</a><div class="board"><section class="panel pad landing" id="venue-agreement"><div class="between"><h2>Community hall</h2>${chip(state.venue?'Confirmed in preview':'On hold',state.venue?'ok':'warn')}</div><dl class="facts"><div><dt>Event date</dt><dd>14 November · 4–8 PM</dd></div><div><dt>Guest capacity</dt><dd>100 seated · sample</dd></div><div><dt>Rental quote</dt><dd>$1,200 · estimated</dd></div><div><dt>Access window</dt><dd>2–9 PM · needs confirmation</dd></div></dl><div class="callout"><strong>What to confirm before saying yes</strong>Access and cleanup times, step-free entry, outside catering, cancellation terms and what the quoted fee covers.</div><div class="checkline">${icon('check')}<div>Quote added to spending plan<small style="display:block">Still an estimate; not proof of a payment or booking.</small></div></div><div class="checkline"><span class="statusdot warn" style="margin-top:6px"></span><div>${state.venue?'Your confirmation is recorded locally':'Signed agreement not recorded'}<small style="display:block">${state.venue?'The sample has no attached document.':'A hold does not establish a booking.'}</small></div></div><div class="actionfoot">${state.venue?btn('Review food next '+icon('arrow'),'food','primary'):btn('Record confirmation','confirm','primary')}${btn('View quote boundary','quote')}</div></section><aside class="panel pad"><h2>What this unlocks</h2><div class="minilist"><p>Food service requirements</p><p>Room layout and rentals</p><p>Setup and arrival windows</p></div><details open><summary>Decision memory</summary><p>${state.venue?esc(state.history.at(-1)?.note||'Confirmation recorded in the sample.'):'No confirmation recorded. Your reason will stay with the decision in this preview.'}</p></details></aside></div>`}
function food(){return `${heading('Shape the meal.','Food & drink · The next decision, with its prerequisites visible.')}<a href="#plan" class="textbtn">${icon('back')} Back to plan</a><div class="board"><section class="panel pad landing"><div class="between"><h2>A seated meal, without rushing</h2>${chip(state.venue?'Ready to review':'Venue first')}</div><dl class="facts"><div><dt>Replies received</dt><dd>54 coming · 22 outstanding</dd></div><div><dt>Planning allowance</dt><dd>$1,800 · estimate only</dd></div><div><dt>Service style</dt><dd>Buffet · sample preference</dd></div><div><dt>Dietary needs</dt><dd>Not fully collected</dd></div></dl><div class="callout"><strong>${state.venue?'Before you order':'Resolve the venue first'}</strong>${state.venue?'Confirm dietary needs and the final guest count. This preview does not calculate safe food quantities.':'Catering access and outside-food rules are not confirmed. Do not treat the menu as a commitment yet.'}</div><div class="actionfoot">${btn(state.venue?'Review guest replies':'Review the venue',state.venue?'guests':'venue','primary')}${btn('Draft menu questions','food-draft')}</div></section><aside class="panel pad"><h2>Keep the moment intact</h2><p class="muted" style="margin-top:16px;font-size:13px">Leave space between dinner and the tributes. The event brief calls for personal stories, not a rushed program.</p></aside></div>`}
function ceremony(){return `${heading('Make the tribute personal.','Recognition & memories · A plan for the moments people will keep.')}<a href="#plan" class="textbtn">${icon('back')} Back to plan</a><section class="panel"><header class="sectionhead"><h2>Three things to settle</h2></header>${taskrow('01','Choose two speakers','Confirm their availability and pronunciation notes','ceremony-draft')}${taskrow('02','Gather a few meaningful photographs','Keep permission and source notes with each image','ceremony-draft')}${taskrow('03','Leave time for family portraits','After the tribute, before guests leave','day')}</section>`}
const guests=[['Morgan Lane','2 guests · Vegetarian meal','Coming'],['Casey Reed','1 guest · Step-free access requested','Coming'],['Taylor Brooks','2 invited · No reply yet','Awaiting'],['Jordan Ellis','1 invited · No reply yet','Awaiting'],['Riley Park','2 guests · No dietary note','Coming'],['Sam Avery','1 invited','Declined']];
function guestrows(){return guests.filter(g=>(state.guestfilter==='all'||g[2]===state.guestfilter)&&g.join(' ').toLowerCase().includes(state.guests.toLowerCase())).map(g=>`<div class="guestrow"><span class="avatar">${g[0].split(' ').map(x=>x[0]).join('')}</span><div><strong>${g[0]}</strong><small>${g[1]}</small></div>${chip(g[2],g[2]==='Coming'?'ok':'')}</div>`).join('')||'<p class="pad muted">No matching guests. Try another name or clear the filter.</p>'}
function guestview(){return `${heading('Your people, in one place.','54 coming · 22 awaiting · 4 declined · 80 invited')}<div class="guesttools"><input class="input" id="guestsearch" placeholder="Find a guest" aria-label="Find a guest" value="${esc(state.guests)}">${btn('Draft a reminder','reminder')}</div><div class="tabs">${['all','Coming','Awaiting','Declined'].map(f=>`<button class="tab" data-guestfilter="${f}" aria-pressed="${state.guestfilter===f}">${f==='all'?'Everyone':f}</button>`).join('')}</div><section class="panel"><header class="sectionhead"><h2>Guest replies</h2><p class="muted" style="font-size:12px;margin-top:8px">Six illustrative records from the sample guest list.</p></header><div id="guestrows">${guestrows()}</div></section>`}
const costs=[['Venue','Estimate · agreement not attached',1200],['Food & drink','Estimate · final count not set',1800],['Photography','Estimate · scope not agreed',600],['Decor & rentals','Estimate · layout not final',400],['Recognition & keepsakes','Estimate',200]];
function budget(){return `${heading('Know what you’re committing to.','Your spending plan—not a payment ledger.')}<div class="board"><div class="stack"><section class="panel pad"><div class="eyebrow muted">Total planned · sample estimates</div><div class="budgettotal">$4,200 <small>of $5,000</small></div><div class="track" aria-hidden="true"><span style="width:84%"></span></div><p class="muted" style="font-size:12px">$800 unallocated. None of these estimates is proof of payment.</p></section><section class="panel"><header class="sectionhead"><h2>What’s included</h2></header>${costs.map(c=>`<div class="moneyrow"><div><b>${c[0]}</b><small>${c[1]}</small></div><b>$${c[2].toLocaleString()}</b></div>`).join('')}</section></div><aside class="panel pad"><h2>Before you pay</h2><p class="muted" style="font-size:13px;margin:16px 0">Confirm the agreement, the amount due and the cancellation terms with the supplier.</p>${btn('Review venue terms','venue','primary')}<details><summary>Payments in this preview</summary><p>No payment provider is connected. No pass, booking, refund or receipt is created.</p></details></aside></div>`}
const cues=[['2:00 PM','Open the room','Alex · Setup lead','Access window unconfirmed'],['3:00 PM','Set the tables','Casey · Family helper','Draft'],['4:00 PM','Welcome guests','Morgan · Welcome lead','Draft'],['5:00 PM','Serve dinner','Food team · Owner to confirm','Draft'],['6:00 PM','Tributes & recognition','Alex · Host','Draft'],['6:30 PM','Family portraits','Photographer · Not booked','Draft']];
function day(){return `${heading('The day, without the scramble.','14 November · Draft schedule · This is not a live event feed.')}<div class="board"><section class="panel"><header class="sectionhead between"><h2>Run of day</h2>${chip('Draft')}</header><div class="timeline">${cues.map((c,i)=>`<div class="cue ${i===0?'landing':''}" id="cue-${i}"><time>${c[0]}</time><div><h3>${c[1]}</h3><p>${c[2]}</p></div>${chip(c[3])}</div>`).join('')}</div><div class="note">Times and owners are sample planning details—not acknowledgements.</div></section><aside class="panel pad"><h2>Set the handoffs before sharing</h2><p class="muted" style="margin:16px 0;font-size:13px">Verify room access, food service and who is responsible for each cue.</p>${btn('Review access times','venue','primary')}${btn('Preview share checklist','share')}</aside></div>`}
function messages(){return `${heading('Keep the conversation with the event.','Sample host channel · Drafts stay on this device for this session.')}<section class="panel"><div class="channel"><h2>Event helpers</h2><p class="muted" style="font-size:12px;margin-top:8px">Alex · Casey · Morgan · illustrative participants</p><div class="bubble"><small>Casey · Sample message</small>Can we confirm when the hall opens? I can help set up once we have an access time.</div>${state.messages.map(m=>`<div class="bubble"><small>Your draft · Not sent</small>${esc(m)}</div>`).join('')}</div><form class="composer" id="messageform"><textarea class="input" name="message" required maxlength="1500" aria-label="Draft message" placeholder="Write a draft—not sent"></textarea><button class="btn primary" type="submit">Save draft</button></form></section>`}
function render(){const r=route(),active=['venue','food','ceremony'].includes(r)?'plan':r;document.querySelectorAll('.railnav,.bottomnav').forEach(n=>n.innerHTML=nav.map(([key,label])=>`<a class="${n.classList.contains('railnav')?'navitem':''}" href="#${key}" ${key===active?'aria-current="page"':''}>${icon(key)}<span>${label}</span></a>`).join(''));document.querySelector('#crumb').textContent=nav.find(n=>n[0]===active)?.[1]||'Messages';document.querySelector('#themeLink').href='events-__OTHER__.html#'+r;
 if(state.scenario==='empty'){main.innerHTML=`<section class="panel empty"><span class="eyebrow">Your first event</span><h1>Start with the occasion.</h1><p>Tell us what you’re bringing people together for. No sales pipeline. No empty control panels.</p>${btn('Create a sample event','new','primary')}</section>`+footer();return}
 if(state.scenario==='error'){main.innerHTML=`<section class="panel empty"><h1>Your event couldn’t be loaded.</h1><p>This is a simulated connection failure. Nothing has been changed or sent.</p>${btn('Try again','retry','primary')}</section>`+footer();return}
 const views={overview,plan,venue,food,ceremony,guests:guestview,budget,day,messages};main.innerHTML=(views[r]||overview)()+footer();}
function modal(title,html){returnFocus=document.activeElement;document.querySelector('#dialogtitle').textContent=title;document.querySelector('.dialogbody').innerHTML=html;if(!dialog.open)dialog.showModal()}
function close(){dialog.close();returnFocus?.focus()}
function toast(text){const el=document.querySelector('.toast');el.textContent=text;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,5000)}
function showSearch(){modal('Find in this event','<input class="input" id="search" aria-label="Search destinations" placeholder="Try venue, guests or budget"><div class="searchresults" id="results"></div>');search('');document.querySelector('#search').focus()}
function search(q){const items=[['venue','Venue agreement and access'],['food','Food and dietary needs'],['guests','Guest replies'],['budget','Budget and estimates'],['day','The Day schedule'],['ceremony','Recognition and memories']].filter(x=>x[1].toLowerCase().includes(q.toLowerCase()));document.querySelector('#results').innerHTML=items.map(([r,l])=>`<button data-action="${r}">${l}</button>`).join('')||'<p>No matching destination.</p>'}
const actions={overview:()=>go('overview'),plan:()=>go('plan'),venue:()=>go('venue'),food:()=>go('food'),ceremony:()=>go('ceremony'),guests:()=>go('guests'),budget:()=>go('budget'),day:()=>go('day'),messages:()=>go('messages'),close,search:showSearch,
 confirm:()=>modal('Record your confirmation',`<p>This records a sample decision only. It does not book the venue, sign an agreement or pay a deposit.</p><form id="confirmform"><label class="field">Why this place works<textarea class="input" name="reason" required minlength="3" maxlength="500" placeholder="Record the reason for choosing it"></textarea></label><label class="row" style="font-size:12px"><input type="checkbox" name="verified" required> I understand this is a local preview, not a booking.</label><button type="submit" class="btn primary">Record sample confirmation</button></form>`),
 history:()=>modal('Decision history',state.history.length?state.history.map(h=>`<div class="callout"><strong>Venue confirmation · Local preview</strong>${esc(h.note)}</div>`).join(''):'<p>No decisions recorded in this preview yet. Open the venue agreement to record a sample confirmation and its reason.</p>'),
 quote:()=>modal('Quote not attached','<p>The $1,200 figure is a fictional estimate. No quote, contract or signature is attached to this concept. Production must show the source document before claiming verified terms.</p>'),
 'food-draft':()=>modal('Questions for the food conversation','<p>Editable sample draft. Nothing will be sent.</p><label class="field">Questions<textarea class="input" rows="5">What is included in the quote? Can dietary requirements be accommodated? When do you need the final count? What access and service equipment do you need?</textarea></label>'+btn('Keep in view','close','primary')),
 'ceremony-draft':()=>modal('Prepare the tribute','<p>Confirm the speakers, pronunciation notes, photo permissions and length of each contribution. This concept does not contact anyone or generate a speech.</p>'+btn('Open the draft schedule','day','primary')),
 reminder:()=>modal('Review your reminder','<p>Sample draft for guests awaiting a reply. Review recipients in the production app before sending. Sending is not connected here.</p><label class="field">Message<textarea class="input" rows="4">We’re looking forward to celebrating together on 14 November. Could you let us know whether you can join us, plus any dietary or access needs?</textarea></label>'+btn('Close draft','close','primary')),
 share:()=>modal('Before you share the day','<p>Confirm access times, verify owners, and check that private guest notes are excluded. This concept does not create a public link or send invitations.</p>'+btn('Return to the schedule','close','primary')),
 events:()=>modal('Your events','<p>One illustrative event is loaded. No account or live event data is connected.</p>'+btn('A celebration of service','overview','primary')+btn('Review first-run state','empty')),
 review:()=>modal('Review this concept','<p>Sample data only. State is kept in memory and resets on reload. The theme links preserve your screen, not edits.</p><div class="stack">'+btn('Populated planning state','normal')+btn('First event / empty state','empty')+btn('Simulated connection failure','error')+btn('Event-day priority preview','dayphase')+'</div>'),
 normal:()=>{state.scenario='normal';state.phase='planning';render()},empty:()=>{state.scenario='empty';render()},error:()=>{state.scenario='error';render()},retry:()=>{state.scenario='normal';render()},dayphase:()=>{state.scenario='normal';state.phase='day';go('overview')},
 new:()=>modal('Create a sample event','<p>For this preview, load the fictional retirement gathering to explore the flow. Production event creation is not connected.</p>'+btn('Load sample event','normal','primary'))};
document.addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(a){const name=a.dataset.action;if(dialog.open&&name!=='close')close();actions[name]?.();}const f=e.target.closest('[data-filter]');if(f){state.filter=f.dataset.filter;render()}const g=e.target.closest('[data-guestfilter]');if(g){state.guestfilter=g.dataset.guestfilter;render()}});
document.addEventListener('input',e=>{if(e.target.id==='search')search(e.target.value);if(e.target.id==='guestsearch'){state.guests=e.target.value;document.querySelector('#guestrows').innerHTML=guestrows()}});
document.addEventListener('submit',e=>{if(e.target.id==='confirmform'){e.preventDefault();const data=new FormData(e.target);state.venue=true;state.history.push({note:data.get('reason')});close();render();toast('Sample confirmation recorded. Food plan is now ready to review.')}if(e.target.id==='messageform'){e.preventDefault();state.messages.push(new FormData(e.target).get('message'));render();toast('Draft saved for this preview. Nothing was sent.')}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();showSearch()}});dialog.addEventListener('close',()=>returnFocus?.focus());
window.addEventListener('hashchange',()=>{if(location.hash==='#main'){main.focus();return}render();window.scrollTo(0,0);main.focus({preventScroll:true})});document.querySelectorAll('[data-icon]').forEach(n=>n.innerHTML=icon(n.dataset.icon));render();
</script></body></html>
