 if(garden){detail+='<path d="M30 250Q85 110 22 35M590 250Q530 100 613 25" stroke="#537b59" stroke-width="8" fill="none"/>';for(let i=0;i<7;i++)detail+=`<ellipse cx="${i%2?34:55}" cy="${55+i*25}" rx="27" ry="10" fill="${i%2?'#5e885a':'#83a66e'}" transform="rotate(${i%2?30:-30} 45 ${55+i*25})"/><ellipse cx="${i%2?585:610}" cy="${45+i*27}" rx="27" ry="11" fill="#71965e" transform="rotate(-25 600 ${45+i*27})"/>`}
 if(portrait){detail='<rect x="110" y="35" width="420" height="240" rx="12" fill="#f9f0d9" transform="rotate(-4 320 155)"/><rect x="129" y="51" width="382" height="192" fill="#c1d1ac" transform="rotate(-4 320 155)"/>';for(let i=0;i<6;i++){const x=176+i*57;detail+=`<path d="M${x-27} 223v-45a27 27 0 0 1 54 0v45" fill="${['#6e4d82','#bd7357','#d7b467','#4d7069','#8c677d','#ac724f'][i]}"/><circle cx="${x}" cy="143" r="20" fill="${['#7e503a','#bc8461','#e7b289','#704632','#c6906f','#976244'][i]}"/>`}detail+='<path d="m75 66 4 14 14 4-14 4-4 14-4-14-14-4 14-4m495 110 4 14 14 4-14 4-4 14-4-14-14-4 14-4" fill="#6740d9"/>'}
 else if(stories){detail+='<rect x="250" y="154" width="140" height="140" fill="#81566d"/><circle cx="320" cy="95" r="28" fill="#9b654c"/><path d="M278 160v-15a42 42 0 0 1 84 0v15" fill="#574569"/><path d="M360 158v-45l-16-8" stroke="#302a36" stroke-width="5"/><rect x="126" y="46" width="108" height="74" rx="18" fill="#fff1dc"/><path d="m205 118 10 17 5-20" fill="#fff1dc"/><path d="M146 70h65m-65 18h45" stroke="#a77d85" stroke-width="4"/>'}
 else {detail+=`<ellipse cx="320" cy="265" rx="215" ry="65" fill="#6d4b6a" opacity=".15"/><path d="M110 220h420v30H110z" fill="#bd8f66"/><ellipse cx="320" cy="215" rx="215" ry="58" fill="${food?'#fff1d4':'#f2d6b8'}"/>`;for(let i=0;i<5;i++){const x=170+i*74;detail+=`<ellipse cx="${x}" cy="${i%2?235:194}" rx="25" ry="12" fill="#fffcf2" stroke="#c5b594" stroke-width="2"/>`}
 detail+='<path d="M320 200v-63m-7 40-22-18m29 0 23-18" stroke="#597b4e" stroke-width="4"/><circle cx="320" cy="133" r="12" fill="#b66870"/><circle cx="289" cy="155" r="10" fill="#df9985"/><circle cx="344" cy="138" r="10" fill="#d79673"/><path d="M305 185h30l-5 30h-20z" fill="#b48baf"/>';
 if(food){for(let i=0;i<3;i++)detail+=`<ellipse cx="${240+i*75}" cy="224" rx="28" ry="10" fill="${['#94a45a','#cf825b','#cfa256'][i]}"/>`}
 }
 return `<svg class="${large?'scene':''}" aria-hidden="true" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice"><rect width="640" height="360" fill="${sky}"/><path d="M0 280Q320 210 640 280V360H0" fill="${electric?'#523b70':'#bda295'}" opacity=".35"/>${detail}<path d="M0 0Q320 110 640 0" stroke="${electric?'#d0b8eb':'#8e7687'}" fill="none" stroke-width="2"/>${[60,145,230,320,410,495,580].map((x,i)=>`<circle cx="${x}" cy="${[17,36,47,52,47,36,17][i]}" r="5" fill="#fff2ba"/>`).join('')}</svg>`
}
const chosen=(key,choices=state.choices)=>data[key].find(x=>x.id===choices[key]);
const price=x=>x?(x.per?x.cost*state.guests:x.cost):0;
const total=(choices=state.choices)=>600+groups.reduce((sum,k)=>sum+price(chosen(k,choices)),0);
function canvas(){const vibe=chosen('vibe'),place=chosen('place'),visual=place||vibe||data.vibe[0];return `<section aria-label="Your event canvas"><div class="canvas" id="event-canvas" style="background:${visual.color}">${state.photo?`<img class="scene photo-scene" src="${state.photo}" alt="Your chosen event photograph">`:art(visual.kind,visual.color,true)}<div class="canvas-top"><span class="canvas-tag">${esc(state.occasion)}</span><button class="round" data-act="personalize" aria-label="Add your own event photograph">${icon('photo')}</button></div><div class="invitation"><div class="star" aria-hidden="true">✳</div><div class="small">You’re invited to</div><h2>${esc(state.name)}</h2><div class="small">${state.guests} people · A day to keep</div></div><div class="moment-sticker"><span class="eyebrow">Make room for</span><p>${esc(state.moment)}</p></div><div class="canvas-bottom"><div><strong>Your gathering, taking shape.</strong><small>${Object.keys(state.choices).length} of 4 creative decisions</small></div><div class="canvas-choices">${groups.filter(k=>state.choices[k]).map(k=>`<button class="canvas-chip" data-stage="${groups.indexOf(k)}">✓ ${labels[groups.indexOf(k)]}</button>`).join('')||'<button class="canvas-empty" data-act="explore">Start shaping ↘</button>'}</div></div></div><div class="canvas-caption"><span>${state.photo?'Your photograph · Kept in this tab':'Illustrated moodboard · Not a real venue'}</span><button data-act="personalize">Make it yours ↗</button></div><div class="budget-strip"><div><small>Working estimate</small><div class="amount">${money(total())}</div></div><div class="track" role="img" aria-label="${Math.round(total()/state.budget*100)} percent of budget target"><i style="width:${Math.min(100,total()/state.budget*100)}%;background:${total()>state.budget?'#b33b48':'var(--purple)'}"></i></div><div><small>${total()>state.budget?'Above target':'Target'}</small><strong style="font-size:12px">${total()>state.budget?money(total()-state.budget):m function steps(){return `<div class="step-tabs" aria-label="Creative decisions">${groups.map((k,i)=>`<button class="${i===state.stage?'active':''} ${state.choices[k]?'done':''}" data-stage="${i}" aria-current="${i===state.stage?'step':'false'}"><span class="num">${state.choices[k]?'✓':String(i+1).padStart(2,'0')}</span>${labels[i]}</button>`).join('')}</div>`}
function decision(){const key=groups[state.stage],item=data[key][state.index],selected=state.choices[key]===item.id;const questions=['How should it feel?','Where’s the magic?','What brings them together?','What will they remember?'];
 if(state.celebrate){const next=(state.stage+1)%4,all=Object.keys(state.choices).length===4;return `${steps()}<div class="success-card" tabindex="-1"><span class="sun" aria-hidden="true">✳</span><div class="big-check" aria-hidden="true">✓</div><span class="eyebrow">Added to your direction</span><h3>${['That’s the atmosphere.','There’s your setting.','Now we’re gathering.','That’s the moment.'][state.stage]}</h3><p><strong>${esc(chosen(key).name)}</strong><br>Your canvas and estimate now reflect this choice. This is a preference, not a booking.</p><button class="primary" data-act="next-stage">${all?'See it all together':'Next: '+labels[next]} ${icon('arrow')}</button><div class="links"><button data-act="browse-again">Keep exploring</button><button data-act="undo">Undo this choice</button></div></div><p class="progress-note">${Object.keys(state.choices).length} decisions made. Your event is becoming yours.</p>`}
 return `${steps()}<div class="question-row"><div><span class="eyebrow">Choose a direction</span><h2>${questions[state.stage]}</h2><p>${state.stage===0?'Start with the feeling. The details can follow.':'Explore three sample ideas. You can always change your mind.'}</p></div><span class="counter">${state.index+1} / 3</span></div><div class="deck"><article class="idea-card ${selected?'selected':''}" id="idea-card" tabindex="0" aria-label="${esc(item.name)}. Use left and right arrow keys to browse."><div class="idea-art">${art(item.kind,item.color)}<span class="idea-kicker">${item.tag}</span>${selected?'<span class="selected-stamp">YOUR<br>CHOICE ✓</span>':''}</div><div class="idea-body"><h3>${item.name}</h3><p class="desc">${item.desc}</p><div class="idea-meta"><span class="pill">${key==='vibe'?'Sets the atmosphere':money(price(item))+' sample estimate'}</span>${item.per?`<span class="pill">${money(item.cost)} × ${state.guests} guests</span>`:''}<span class="pill">${key==='vibe'?'Change anytime':(price(item)-(price(chosen(key))))>=0?'+ '+money(price(item)-price(chosen(key)))+' to plan':money(price(item)-price(chosen(key)))+' to plan'}</span></div><p class="tradeoff">${item.trade}</p></div><div class="decision-actions"><button class="arrow" data-act="previous" aria-label="Previous idea">‹</button><button class="primary" data-act="choose">${selected?'Keep this direction':'This feels right'} ${icon('check')}</button><button class="arrow" data-act="next" aria-label="Next idea">›</button></div><div class="gesture-label" aria-hidden="true">Next idea →</div></article></div><p class="browse-hint">Drag to explore · Click to choose · Nothing is booked</p><div class="assistant"><span class="spark" aria-hidden="true">✳</span><div><strong>Want a starting point?</strong><p>A sample plan from your choices, guest count and target.</p></div><button data-act="draft">Build a draft ↗</button></div>`
}
function recap(){return `<section class="recap"><span class="eyebrow">Your direction, together</span><h2>This is starting to feel like you.</h2>${groups.map((k,i)=>{const item=chosen(k);return `<div class="recap-row"><span class="recap-icon" aria-hidden="true">${['✳','⌂','◒','♡'][i]}</span><div><small>${labels[i]}</small><strong>${item?item.name:'Still open. Explore a few ideas.'}</strong></div><button data-stage="${i}">${item?'Change':'Explore'}</button></div>`}).join('')}<div class="shape-controls"><button class="pill" data-act="budget">${state.guests} guests · ${money(state.budget)} target ↗</button><button class="pill" data-act="personalize">Edit your moment ↗</button></div><div class="recap-note"><strong>A direction, not a done deal.</strong><br>Venue terms, availability, dietary needs and supplier prices still need checking.</div><button class="primary" data-act="draft" style="width:100%;margin-top:22px">${Object.keys(state.choices).length?'Review a prepared draft':'Build my first draft'} ${icon('arrow')}</button></section>`}
function day(){const moment=chosen('moment');return `<section class="recap"><span class="eyebrow">An evening with breathing room</span><h2>Let the day unfold.</h2><p style="font-size:12px;color:var(--muted);margin-top:14px">Illustrative timing, not a confirmed schedule. No helpers have been assigned.</p><div class="timeline">${[['3:00','Make the space yours',chosen('place')?.name||'Confirm access and choose your setting.','Access unverified'],['4:00','Let everyone arrive','A drink, a familiar face, a little room to settle.','Draft'],['5:00',chosen('food')?.name||'Bring everyone together','Confirm dietary needs and timing with the caterer.','Draft'],['6:00',moment?.name||'Make room for your moment',state.moment,'Protect this time'],['7:30','Leave on a high','Time for one more story. Confirm cleanup and departure.','Draft']].map(([time,title,desc,tag])=>`<div class="timeline-row"><time>${time}</time><div><h3>${esc(title)}</h3><p>${esc(desc)}</p><span class="pill">${tag}</span></div></div>`).join('')}</div><button class="secondary" data-act="personalize">Change the moment to protect ↗</button></section>`}
function render(){document.documentElement.style.setProperty('--accent',chosen('vibe')?.color||'#6740d9');$('.personalize .name').textContent=state.name;document.querySelectorAll('[data-view]').forEach(el=>{el.setAttribute('aria-current',el.dataset.view===state.view?'page':'false')});$('#app').innerHTML=`<div class="intro"><div><span class="eyebrow">Less managing. More making memories.</span><h1>Make it <em>your kind</em> of gathering.</h1></div><p>A few thoughtful choices.<br>A celebration that feels like you.</p></div><div class="layout">${canvas()}<section class="workspace" id="workspace" tabindex="-1" aria-label="Planning workspace">${state.view==='imagine'?decision():state.view==='shape'?recap():day()}</section></div><footer class="footer">A creative prototype, not a live planning service. Estimates are invented examples. Photos stay in this tab.<br><button class="motion-toggle" data-act="motion">${state.calm?'Turn expressive motion on':'Prefer less motion?'}</button> · <button class="motion-toggle" data-act="reset">Start fresh</button></footer>`;document.body.classList.toggle('calm',state.calm)}
function snapshot(){return {...state,choices:{...state.choices}}}
function notify(message,undo=true){clearTimeout(toastTimer);$('.toast span').textContent=message;$('.toast button').hidden=!undo;$('.toast').hidden=false;toastTimer=setTimeout(()=>$('.toast').hidden=true,6500)}
function focusWorkspace(){const el=$('#workspace');el.focus({preventScroll:true});if(innerWidth<761)el.scrollIntoView({block:'start',behavior:reduced()?'instant':'smooth'})}
function burst(rect){if(reduced())return;for(let i=0;i<20;i++){const bit=document.createElement('i');bit.className='confetti';bit.style.background=['#6740d9','#dced94','#f4977c','#f5bf59'][i%4];bit.style.left=(rect.x+rect.width/2)+'px';bit.style.top=(rect.y+80)+'px';document.body.append(bit);const a=bit.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${(i%2?1:-1)*(50+Math.random()*170)}px,${-70+Math.random()*240}px) rotate(${Math.random()*540}deg)`,opacity:0}],{duration:700+Math.random()*250,easing:'cubic-bezier(.1,.7,.3,1)'});a.onfinish=()=>bit.remove()}}
async function choose(){if(busy)return;busy=true;history.push(snapshot());const card=$('#idea-card'),rect=card.getBoundingClientRect(),key=groups[state.stage];state.choices[key]=data[key][state.index].id;state.celebrate=true;const a=animate(card,[{transform:'scale(1)',opacity:1},{transform:'scale(.92) rotate(-3deg)',opacity:0}],{duration:180,easing:'ease-in'});if(a)await a.finished.catch(()=>{});render();animate($('.success-card'),[{transform:'translateY(25px) scale(.94)',opacity:0},{transform:'translateY(0) scale(1)',opacity:1}],{duration:560});animate($('#event-canvas'),[{transform:'scale(.97)'},{transform:'scale(1)'}],{duration:650});burst(rect);$('.success-card').focus({preventScroll:true});busy=false;notify('Your canvas just changed. You can change your mind.')}
function browse(delta){if(busy)return;state.index=(state.index+delta+3)%3;render();animate($('#idea-card'),[{transform:`translateX(${delta>0?70:-70}px) rotate(${delta>0?5:-5}deg)`,opacity:.2},{transform:'translateX(0) rotate(0)',opacity:1}],{duration:430});$('#idea-card').focus({preventScroll:true})}
function stage(i){state.stage=i;state.index=Math.max(0,data[groups[i]].findIndex(x=>x.id===state.choices[groups[i]]));state.celebrate=false;state.view='imagine';render();focusWorkspace()}
function undo(){if(!history.length){notify('Nothing to undo yet.',false);return}state=history.pop();state.celebrate=false;render();focusWorkspace();notify('Rewound. Your previous direction is back.',false)}
function modal(title,html){returnFocus=document.activeElement;$('#dialog-title').textContent=title;$('.dialogbody').innerHTML=html;$('dialog').showModal();animate($('dialog'),[{transform:'translateY(25px) scale(.97)',opacity:0},{transform:'translateY(0) scale(1)',opacity:1}],{duration:350})}
function close(){if($('dialog').open)$('dialog').close()}
$('dialog').addEventListener('close',()=>returnFocus?.isConnected&&returnFocus.focus({preventScroll:true}));
function personalize(){pendingPhoto=state.photo;photoLoading=false;modal('Give it your personality.',`<form id="person-form"><label class="field">Name your gathering<input name="name" maxlength="45" value="${esc(state.name)}" required></label><label class="field">What’s the occasion?<input name="occasion" maxlength="45" value="${esc(state.occasion)}" required></label><label class="field">The moment you want to keep<textarea name="moment" rows="2" maxlength="100" required>${esc(state.moment)}</textarea></label><label class="field">Bring your own photograph<input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp"></label><div id="photo-preview">${state.photo?`<img src="${state.photo}" class="upload-preview" alt="Your event photograph">`:'<div class="empty-photo">Your image will replace the illustrated canvas.</div>'}</div><p id="photo-status" role="status">JPEG, PNG or WebP, up to 10 MB. It stays in this tab.</p><button type="button" class="secondary" data-act="remove-photo">Use illustration instead</button><div class="form-actions"><button type="button" class="secondary" data-act="close">Cancel</button><button class="primary" type="submit">Make it mine ${icon('arrow')}</button></div></form>`)}
function budget(){modal('Make room in the budget.',`<form id="budget-form"><label class="field">People at your gathering<input name="guests" type="number" min="10" max="200" value="${state.guests}" required></label><label class="field">Your planning target <output id="budget-output">${money(state.budget)}</output><input type="range" name="budget" min="1500" max="12000" step="100" value="${state.budget}"></label><div class="draft-total"><span style="font-size:11px">Your selected ideas + essentials</span><br><strong id="estimate-preview">${money(total())}</strong><p style="margin:5px 0 0">Invented planning estimates, not supplier quotes.</p></div><div class="form-actions"><button type="button" class="secondary" data-act="close">Cancel</button><button class="primary" type="submit">Update my plan</button></div></form>`)}
function prepareDraft(){draft={...state.choices};for(const key of groups){if(!draft[key])draft[key]=key==='vibe'?'golden':key==='place'?'hall':key==='food'?(draft.vibe==='electric'?'bites':'buffet'):'portrait'}const over=total(draft)>state.budget;modal('A first draft. Already lighter.',`<p>A local sample rule fills open choices and keeps yours. This is not live AI, availability research or a booking.</p>${groups.map((key,i)=>{const item=chosen(key,draft);return `<div class="draft-row"><span class="recap-icon" aria-hidden="true">${['✳','⌂','◒','♡'][i]}</span><div><strong>${item.name}</strong><small>${state.choices[key]?'Your choice, retained':'Suggested starting point'}</small></div><span class="price">${money(price(item))}</span></div>`}).join('')}<div class="draft-total"><strong>${money(total(draft))}</strong><p style="margin:5px 0 0">Including $600 essentials · ${over?money(total(draft)-state.budget)+' above target. Revise your choices or target.':money(state.budget-total(draft))+' below your target.'}</p></div><p>Why this mix: ${draft.vibe==='electric'?'bites support a mingling atmosphere':'the buffet offers a flexible starting point'}. A hall leaves room to personalize. These are sample design assumptions.</p><div class="form-actions"><button type="button" class="secondary" data-act="close">Keep exploring</button><button type="button" class="primary" data-act="apply-draft">Use this direction</button></div>`)}
const actions={close,personalize,explore:()=>{state.view='imagine';render();focusWorkspace()},budget,draft:prepareDraft,choose,next:()=>browse(1),previous:()=>browse(-1),undo,'browse-again':()=>{state.celebrate=false;render();focusWorkspace()},'next-stage':()=>{if(Object.keys(state.choices).length===4){state.view='shape';state.celebrate=false;render();focusWorkspace()}else stage((state.stage+1)%4)},'apply-draft':()=>{history.push(snapshot());state.choices={...draft};state.view='shape';state.celebrate=false;close();render();focusWorkspace();animate($('#event-canvas'),[{transform:'scale(.94)',opacity:.5},{transform:'scale(1)',opacity:1}],{duration:650});notify('A first direction is ready. Every choice is still editable.')},'remove-photo':()=>{pendingPhoto=null;$('#photo-preview').innerHTML='<div class="empty-photo">Illustration selected. Save to apply.</div>';$('#photo-status').textContent='Your current photograph stays unchanged until you save.'},motion:()=>{state.calm=!state.calm;if(state.calm){document.getAnimations().forEach(a=>a.cancel());document.querySelectorAll('.confetti').forEach(el=>el.remove())}render();notify(state.calm?'Expressive motion is off.':'Expressive motion is on (unless your system prefers reduced motion).',false)},reset:()=>modal('Start a fresh direction?',`<p>This clears this tab’s choices and personal photograph. It does not affect a live event.</p><div class="form-actions"><button class="secondary" data-act="close">Keep my plan</button><button class="primary" data-act="reset-confirm">Start fresh</button></div>`),'reset-confirm':()=>location.reload()};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a){e.preventDefault();if(!busy)actions[a.dataset.act]?.();return}const s=e.target.closest('[data-stage]');if(s&&!busy){stage(Number(s.dataset.stage));return}const v=e.target.closest('[data-view]');if(v&&!busy){state.view=v.dataset.view;state.celebrate=false;render();focusWorkspace()}});
document.addEventListener('keydown',e=>{if(e.target.id==='idea-card'&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();browse(e.key==='ArrowRight'?1:-1)}});
document.addEventListener('pointerdown',e=>{const card=e.target.closest('#idea-card');if(!card||busy||e.button!==0||e.target.closest('button,a,input'))return;drag={id:e.pointerId,x:e.clientX,y:e.clientY};card.setPointerCapture(e.pointerId)});
document.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)<Math.abs(dy))return;const card=$('#idea-card');card.classList.add('dragging');if(!reduced())card.style.transform=`translateX(${Math.max(-95,Math.min(95,dx*.55))}px) rotate(${dx/45}deg)`;const label=card.querySelector('.gesture-label');label.textContent=dx<0?'Next idea →':'← Previous idea';label.style.opacity=Math.min(.85,Math.abs(dx)/180)});
function endDrag(e,cancel=false){if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag=null;if(!cancel&&Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.4)browse(dx<0?1:-1);else{const card=$('#idea-card');card?.classList.remove('dragging');if(card){const from=card.style.transform;card.style.transform='';card.querySelector('.gesture-label').style.opacity=0;animate(card,[{transform:from||'none'},{transform:'translateX(0) rotate(0)'}],{duration:350})}}}
document.addEventListener('pointerup',e=>endDrag(e));document.addEventListener('pointercancel',e=>endDrag(e,true));
document.addEventListener('input',e=>{if(e.target.closest('#budget-form')){const f=$('#budget-form'),count=Number(f.guests.value),target=Number(f.budget.value);$('#budget-output').textContent=money(target);const estimate=600+groups.reduce((sum,k)=>{const item=chosen(k);return sum+(item?(item.per?item.cost*count:item.cost):0)},0);$('#estimate-preview').textContent=Number.isFinite(estimate)?money(estimate):'—'}});
document.addEventListener('change',async e=>{if(e.target.id!=='photo-input')return;const file=e.target.files[0];if(!file)return;const status=$('#photo-status'),submit=$('#person-form [type=submit]');if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>10*1024*1024){status.textContent='Choose a JPEG, PNG or WebP smaller than 10 MB.';status.className='error';return}photoLoading=true;submit.disabled=true;status.textContent='Preparing your photograph…';try{const result=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});const img=new Image();img.src=result;await img.decode();if(!$('#person-form')||!$('dialog').open)return;pendingPhoto=result;$('#photo-preview').innerHTML=`<img src="${result}" class="upload-preview" alt="Selected event photograph">`;status.className='';status.textContent='Ready. Make it yours to update the canvas.'}catch{status.className='error';status.textContent='That image could not be opened. Try another.'}finally{photoLoading=false;submit.disabled=false}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.id==='person-form'){if(photoLoading)return;const name=f.elements.name.value.trim(),occasion=f.occasion.value.trim(),moment=f.moment.value.trim();if(!name||!occasion||!moment)return;history.push(snapshot());Object.assign(state,{name,occasion,moment,photo:pendingPhoto});close();render();animate($('#event-canvas'),[{transform:'scale(.96)',opacity:.4},{transform:'scale(1)',opacity:1}],{duration:650});notify('Now it looks like your gathering.')}if(f.id==='budget-form'){history.push(snapshot());state.guests=Number(f.guests.value);state.budget=Number(f.budget.value);close();render();notify('Guest count and estimate updated together.')}});
render();
</script></body></html>
